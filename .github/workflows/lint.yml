name: lint

on:
  push:
    branches: [ master ]
  pull_request:

# Runners are pinned: these jobs were verified on Ubuntu 24.04, and
# ubuntu-latest moves to 26.04 from 2026-10-19. Move the pin deliberately.
jobs:
  php-syntax:
    # Blocking: application PHP must parse on the support floor and image runtime.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
      - name: php -l
        run: |
          fail=0
          while IFS= read -r f; do
            php -l "$f" > /dev/null || { echo "::error file=$f::PHP syntax error"; fail=1; }
          done < <(find . -type f -name '*.php' -not -path './tests/*' -not -path './node_modules/*')
          exit $fail

  editorconfig:
    # Advisory for now: the existing tree has a backlog of whitespace issues.
    # The plan is to clear it in small per-file PRs, then make this blocking.
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # editorconfig-checker@7 declares node >=24.14.0. On anything older it
      # throws out of its own startup before it downloads the checker, and
      # exits 0 -- a job that reads no file and reports success. Without this
      # step the runner's default node decides, and it has been older.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: editorconfig-checker
        # Both halves are pinned on purpose. The wrapper has to be one that
        # knows the current release asset names as well as the legacy ones,
        # and EC_VERSION pins the checker it downloads -- left to itself it
        # takes whatever release is latest, so an upstream change lands here
        # without a commit.
        env:
          EC_VERSION: v4.0.1
        run: npx --yes editorconfig-checker@7

  eslint:
    # Advisory for now (same plan as editorconfig).
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: install eslint
        working-directory: tests
        run: npm ci
      - name: eslint
        working-directory: tests
        run: npm run lint

  phpstan:
    # Blocking: the tree is at zero level-0 findings and stays there.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.1'
          tools: phpstan:2.2.9
      - name: phpstan
        run: phpstan analyse --no-progress --memory-limit=512M --error-format=github

  image-lint:
    # Stable producer contract consumed by docker-rutorrent's exact-SHA check gate.
    # Advisory editorconfig/eslint remain outside this blocking release contract.
    name: rutorrent-image-lint-v1
    needs: [php-syntax, phpstan]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    env:
      SYNTAX_RESULT: ${{ needs.php-syntax.result }}
      PHPSTAN_RESULT: ${{ needs.phpstan.result }}
    steps:
      - name: Require all blocking syntax and static-analysis jobs
        run: |
          test "$SYNTAX_RESULT" = success
          test "$PHPSTAN_RESULT" = success
