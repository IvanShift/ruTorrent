name: tests

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      # Complete both supported runtimes after one fails, preserving the
      # independent result needed to reproduce and diagnose a PHP-only failure.
      fail-fast: false
      matrix:
        php: ['7.4', '8.1']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: posix, dom, xml, mbstring, iconv, json, curl
      - name: PHP test suite
        id: php_tests
        run: |
          set -o pipefail
          bash php-test.sh 2>&1 | tee "php-test-${{ matrix.php }}.log"
        working-directory: tests
      - name: Upload PHP failure log
        if: ${{ failure() && steps.php_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: php-${{ matrix.php }}-failure-log
          path: tests/php-test-${{ matrix.php }}.log
          if-no-files-found: error
          retention-days: 14

  jest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
        working-directory: tests
      - run: npm test
        working-directory: tests
