name: tests

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Native helper setup contract tests
        run: |
          python3 tests/tools/native-helper-setup-test.py
          python3 tests/tools/matrix-native-leg-test.py
      - name: Shell fixture tests
        run: |
          mkdir -p "$RUNNER_TEMP/rutorrent-tool-tests"
          export TMPDIR="$RUNNER_TEMP/rutorrent-tool-tests"
          bash tests/tools/rt-lab-test.sh
          bash tests/tools/matrix-test.sh

  php:
    runs-on: ubuntu-latest
    strategy:
      # Complete all selected runtimes after one fails, preserving the
      # independent result needed to reproduce and diagnose a PHP-only failure.
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          # Keep timing gates independent of runner-installed coverage drivers.
          coverage: none
          extensions: posix, dom, xml, mbstring, iconv, json, curl
      - name: Prepare native helpers for the PHP suite
        run: |
          php_tmp=$(mktemp -d /var/tmp/rutorrent-php.XXXXXX)
          printf 'TMPDIR=%s\n' "$php_tmp" >> "$GITHUB_ENV"
          helper_dir=$(mktemp -d "$RUNNER_TEMP/rutorrent-native.XXXXXX")
          trap 'rm -rf -- "$helper_dir"' EXIT
          python3 tests/tools/native-helper-setup.py --output-dir "$helper_dir"
          while IFS= read -r helper; do
            sudo install -m 755 -- "$helper_dir/$helper" "/usr/local/bin/$helper"
          done < "$helper_dir/helpers.list"
          rename_path=$(php -r 'require "php/nativehelpers.php"; echo NativeHelpers::path("rutorrent-erasedata-rename-noreplace");')
          TMPDIR="$php_tmp" bash tests/plugins/erasedata/rename-noreplace-test.sh "$rename_path"
      - name: PHP harness fixture tests
        run: bash tests/tools/php-harness-test.sh
      - name: PHP test suite
        id: php_tests
        run: |
          set -o pipefail
          bash php-test.sh 2>&1 | tee "php-test-${{ matrix.php }}.log"
        working-directory: tests
      - name: Upload PHP failure log
        if: ${{ failure() && steps.php_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: php-${{ matrix.php }}-failure-log
          path: tests/php-test-${{ matrix.php }}.log
          if-no-files-found: error
          retention-days: 14

      - name: Remove private PHP scratch
        if: ${{ always() }}
        run: |
          case "${TMPDIR:-}" in
            /var/tmp/rutorrent-php.*) rm -rf -- "$TMPDIR" ;;
          esac

  jest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
        working-directory: tests
      - run: npm test
        working-directory: tests

  image-tests:
    # Stable producer contract consumed by docker-rutorrent's exact-SHA check gate.
    # Keep this name; changing it requires a paired Docker gate contract version.
    name: rutorrent-image-tests-v1
    needs: [tooling, php, jest]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      TOOLING_RESULT: ${{ needs.tooling.result }}
      PHP_RESULT: ${{ needs.php.result }}
      JEST_RESULT: ${{ needs.jest.result }}
    steps:
      - name: Require all blocking test jobs including the PHP 8.5 image runtime
        run: |
          test "$TOOLING_RESULT" = success
          test "$PHP_RESULT" = success
          test "$JEST_RESULT" = success
